<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ISL · Remitos Digitales</title>
<style>
  :root{
    --gris-isl:#4a4e54;
    --gris-isl-oscuro:#2b2d31;
    --rojo-isl:#c81f3f;
    --rojo-isl-oscuro:#9e1832;
    --fondo:#f2f1ee;
    --superficie:#ffffff;
    --borde:#dcdad4;
    --texto:#2b2d31;
    --texto-tenue:#75797f;
    --exito:#2e7d32;
    --exito-fondo:#eaf4ea;
    --error:#b3261e;
    --error-fondo:#fbeceb;
    --radio:10px;
    --sombra:0 1px 2px rgba(43,45,49,0.06), 0 1px 8px rgba(43,45,49,0.05);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--fondo);
    color:var(--texto);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }

  header{
    background:var(--gris-isl-oscuro);
    padding:20px 20px 24px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  header img{ height:30px; }
  header h1{
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0;
  }
  header .sub{
    color:#b8bcc2;
    font-size:11px;
    letter-spacing:0.04em;
    margin-top:2px;
  }

  main{
    max-width:520px;
    margin:-14px auto 0;
    padding:0 14px;
  }

  .card{
    background:var(--superficie);
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    padding:18px 16px;
    margin-bottom:14px;
  }

  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--rojo-isl);
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:14px;
  }
  .eyebrow .num{
    background:var(--gris-isl-oscuro);
    color:#fff;
    border-radius:4px;
    padding:2px 6px;
    font-size:10px;
  }

  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--gris-isl-oscuro);
    margin:0 0 6px;
  }
  label .req{ color:var(--rojo-isl); }

  select, input[type=text], input[type=number], textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--borde);
    border-radius:8px;
    font-size:15px;
    color:var(--texto);
    background:#fff;
    font-family:inherit;
  }
  select:focus, input:focus, textarea:focus{
    outline:2px solid var(--rojo-isl);
    outline-offset:1px;
    border-color:var(--rojo-isl);
  }

  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }

  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .segmented{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .segmented button{
    padding:14px 8px;
    border-radius:8px;
    border:1.5px solid var(--borde);
    background:#fff;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--texto-tenue);
    cursor:pointer;
  }
  .segmented button.activo{
    border-color:var(--rojo-isl);
    background:var(--rojo-isl);
    color:#fff;
  }

  .item-row{
    border:1px solid var(--borde);
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    position:relative;
  }
  .item-row .item-num{
    position:absolute;
    top:-9px;
    left:10px;
    background:var(--gris-isl-oscuro);
    color:#fff;
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
  }
  .item-row .quitar{
    position:absolute;
    top:8px;
    right:8px;
    background:none;
    border:none;
    color:var(--texto-tenue);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    padding:2px 6px;
  }
  .item-grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .item-grid3{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
  }

  .btn-agregar{
    width:100%;
    padding:12px;
    border:1.5px dashed var(--borde);
    border-radius:8px;
    background:#fafaf9;
    color:var(--gris-isl);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
    cursor:pointer;
    text-transform:uppercase;
  }

  .btn-submit{
    width:100%;
    padding:16px;
    border:none;
    border-radius:8px;
    background:var(--rojo-isl);
    color:#fff;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(200,31,63,0.3);
  }
  .btn-submit:active{ background:var(--rojo-isl-oscuro); }
  .btn-submit:disabled{ background:#c9c9c9; box-shadow:none; cursor:default; }

  .banner{
    padding:12px 14px;
    border-radius:8px;
    font-size:13.5px;
    margin-bottom:14px;
    display:none;
  }
  .banner.error{ background:var(--error-fondo); color:var(--error); display:block; }

  /* Pantalla de éxito */
  .overlay{
    position:fixed; inset:0;
    background:rgba(43,45,49,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.visible{ display:flex; }
  .modal{
    background:#fff;
    border-radius:14px;
    max-width:380px;
    width:100%;
    padding:28px 24px 24px;
    text-align:center;
  }
  .sello{
    width:88px; height:88px;
    border:4px solid var(--exito);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 16px;
    transform:rotate(-8deg);
    animation:sello-pop 0.35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes sello-pop{
    0%{ transform:rotate(-8deg) scale(0.4); opacity:0; }
    100%{ transform:rotate(-8deg) scale(1); opacity:1; }
  }
  .sello svg{ width:44px; height:44px; }
  .modal h2{ font-size:18px; margin:0 0 4px; color:var(--gris-isl-oscuro); }
  .modal .remito-id{
    font-size:22px; font-weight:800; letter-spacing:0.02em;
    color:var(--rojo-isl); margin:6px 0 18px;
  }
  .modal a.ver-pdf{
    display:block;
    padding:13px;
    background:var(--gris-isl-oscuro);
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
    margin-bottom:10px;
  }
  .modal button.nuevo{
    display:block;
    width:100%;
    padding:12px;
    background:none;
    border:1.5px solid var(--borde);
    border-radius:8px;
    color:var(--texto-tenue);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }

  .loading-line{
    font-size:12px; color:var(--texto-tenue); text-align:center; margin-top:8px;
  }

  .oculto{ display:none !important; }
</style>
</head>

  <div>
    <h1>Remitos Digitales</h1>
    <div class="sub">Instrumental San Lorenzo</div>
  </div>
</header>

<main>

  <div id="bannerError" class="banner error"></div>

  <form id="formRemito">

    <!-- 1. TIPO DE RECURSO -->
    <div class="card">
      <div class="eyebrow"><span class="num">01</span> Tipo de envío</div>
      <div class="segmented" id="segmentedTipo">
        <button type="button" data-tipo="Herramienta" class="activo">Herramienta</button>
        <button type="button" data-tipo="EPP">EPP</button>
      </div>
    </div>

    <!-- 2. ORIGEN / DESTINO -->
    <div class="card">
      <div class="eyebrow"><span class="num">02</span> Origen y destino</div>
      <div class="field">
        <label>Origen <span class="req">*</span></label>
        <select id="obraOrigen" required></select>
      </div>
      <div class="field">
        <label>Destino <span class="req">*</span></label>
        <select id="obraDestino" required></select>
      </div>
    </div>

    <!-- 2b. DATOS DEL CLIENTE (solo si el destino es externo, ej. ingreso a planta) -->
    <div class="card oculto" id="cardCliente">
      <div class="eyebrow"><span class="num">02b</span> Datos del cliente (ingreso a planta)</div>
      <div class="field">
        <label>Señor/es <span class="req">*</span></label>
        <input type="text" id="cliente" placeholder="Razón social del cliente">
      </div>
      <div class="grid2">
        <div class="field">
          <label>Domicilio</label>
          <input type="text" id="domicilio" placeholder="Ej: Ruta 10 y Ruta 11">
        </div>
        <div class="field">
          <label>Localidad</label>
          <input type="text" id="localidad" placeholder="Ej: San Lorenzo">
        </div>
      </div>
      <div class="field">
        <label>C.U.I.T. N° (opcional)</label>
        <input type="text" id="cuit" placeholder="Opcional">
      </div>
    </div>

    <!-- 3. ENTREGA / RECIBE -->
    <div class="card">
      <div class="eyebrow"><span class="num">03</span> Entrega y recepción</div>
      <div class="field">
        <label>Quién entrega <span class="req">*</span></label>
        <input type="text" id="entrega" placeholder="Nombre de quien despacha" required>
      </div>
      <div class="field">
        <label>Destinatario <span class="req">*</span></label>
        <select id="recibeId" required></select>
      </div>
    </div>

    <!-- 4. ITEMS -->
    <div class="card">
      <div class="eyebrow"><span class="num">04</span> Ítems del remito</div>
      <div id="listaItems"></div>
      <button type="button" class="btn-agregar" id="btnAgregarItem">+ Agregar ítem</button>
    </div>

    <!-- 5. OBSERVACIONES (solo EPP) -->
    <div class="card oculto" id="cardObservaciones">
      <div class="eyebrow"><span class="num">05</span> Observaciones</div>
      <div class="field">
        <textarea id="observaciones" rows="2" placeholder="Opcional"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">Generar remito</button>
    <div class="loading-line oculto" id="loadingLine">Generando remito, no cierres esta pantalla…</div>

  </form>

</main>

<!-- Overlay de éxito -->
<div class="overlay" id="overlayExito">
  <div class="modal">
    <div class="sello">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2>Remito generado</h2>
    <div class="remito-id" id="remitoIdTexto">REM-000000</div>
    <a href="#" target="_blank" class="ver-pdf" id="linkVerPdf">Ver PDF del remito</a>
    <button type="button" class="nuevo" id="btnNuevoRemito">Cargar otro remito</button>
  </div>
</div>

<script>
  // ==== CONFIGURACIÓN — completar con la URL de tu Web App desplegada ====
  const WEBAPP_URL = "PEGAR_URL_WEB_APP_AQUI";

  const state = {
    tipo: "Herramienta",
    nodos: [],
    personal: [],
    herramientasDisponibles: [],
    cargandoHerramientas: false,
    items: []
  };

  const $ = (id) => document.getElementById(id);

  function nuevoItemVacio(){
    return {
      codigo: "", descripcion: "", cantidad: 1, unidad: "un",
      extra: {}, herramientaId: null,
      modo: state.tipo === "Herramienta" ? "lista" : "manual"
    };
  }

  function renderItems(){
    const cont = $("listaItems");
    cont.innerHTML = "";
    state.items.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "item-row";

      if (state.tipo === "Herramienta" && item.modo === "lista") {
        row.innerHTML = renderItemHerramientaLista_(item, idx);
      } else if (state.tipo === "Herramienta") {
        row.innerHTML = renderItemHerramientaManual_(item, idx);
      } else {
        row.innerHTML = renderItemGenerico_(item, idx);
      }
      cont.appendChild(row);
    });

    // Selects de herramienta (modo lista)
    cont.querySelectorAll("select[data-campo='herramienta_id']").forEach(sel => {
      sel.addEventListener("change", (e) => {
        const idx = parseInt(e.target.dataset.idx, 10);
        const h = state.herramientasDisponibles.find(x => String(x.id) === e.target.value);
        if (h) {
          state.items[idx].herramientaId = h.id;
          state.items[idx].codigo = h.codigo;
          state.items[idx].descripcion = h.descripcion;
          state.items[idx].extra.Marca = h.marca || "";
          state.items[idx].extra.Modelo = h.modelo || "";
          state.items[idx].extra.NroSerie = h.nroSerie || "";
        }
        renderItems();
      });
    });

    // Inputs de texto/número (cantidad, y todos los campos del modo manual)
    cont.querySelectorAll("input").forEach(inp => {
      inp.addEventListener("input", (e) => {
        const idx = parseInt(e.target.dataset.idx, 10);
        const campo = e.target.dataset.campo;
        if (campo === "cantidad") {
          state.items[idx].cantidad = parseInt(e.target.value, 10) || 1;
        } else if (campo === "extra_marca") {
          state.items[idx].extra.Marca = e.target.value;
        } else if (campo === "extra_modelo") {
          state.items[idx].extra.Modelo = e.target.value;
        } else if (campo === "extra_nroserie") {
          state.items[idx].extra.NroSerie = e.target.value;
        } else {
          state.items[idx][campo] = e.target.value;
        }
      });
    });

    // Toggle lista / manual
    cont.querySelectorAll(".toggle-modo").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const idx = parseInt(e.target.dataset.idx, 10);
        const item = state.items[idx];
        item.modo = item.modo === "lista" ? "manual" : "lista";
        item.herramientaId = null;
        item.codigo = ""; item.descripcion = ""; item.extra = {};
        renderItems();
      });
    });

    cont.querySelectorAll(".quitar").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const idx = parseInt(e.target.dataset.idx, 10);
        state.items.splice(idx, 1);
        renderItems();
      });
    });
  }

  function renderItemHerramientaLista_(item, idx){
    const opciones = state.herramientasDisponibles.map(h =>
      `<option value="${h.id}" ${item.herramientaId === h.id ? "selected" : ""}>${h.codigo} · ${h.descripcion}${h.marca ? " · " + h.marca : ""}${h.modelo ? " " + h.modelo : ""}</option>`
    ).join("");
    const sinStock = state.herramientasDisponibles.length === 0;
    return `
      <span class="item-num">Ítem ${idx + 1}</span>
      ${state.items.length > 1 ? `<button type="button" class="quitar" data-idx="${idx}">×</button>` : ""}
      <div class="field" style="margin-bottom:0">
        <label style="font-size:11.5px">Herramienta (del inventario en el origen) <span class="req">*</span></label>
        ${sinStock
          ? `<div style="font-size:12.5px;color:var(--texto-tenue);padding:8px 0">${state.cargandoHerramientas ? "Buscando herramientas…" : "No hay herramientas operativas cargadas en ese origen."}</div>`
          : `<select data-idx="${idx}" data-campo="herramienta_id" required>
               <option value="" disabled ${!item.herramientaId ? "selected" : ""}>Elegir herramienta…</option>
               ${opciones}
             </select>`}
      </div>
      ${item.herramientaId ? `
      <div class="field" style="margin-top:8px;margin-bottom:0">
        <label style="font-size:11.5px">Cantidad <span class="req">*</span></label>
        <input type="number" min="1" data-idx="${idx}" data-campo="cantidad" value="${item.cantidad}" required style="max-width:120px">
      </div>` : ""}
      <button type="button" class="toggle-modo" data-idx="${idx}" style="margin-top:10px;background:none;border:none;color:var(--rojo-isl);font-size:12px;font-weight:600;padding:0;cursor:pointer">Cargar manualmente en su lugar</button>
    `;
  }

  function renderItemHerramientaManual_(item, idx){
    return `
      <span class="item-num">Ítem ${idx + 1}</span>
      ${state.items.length > 1 ? `<button type="button" class="quitar" data-idx="${idx}">×</button>` : ""}
      <div class="field" style="margin-bottom:0">
        <label style="font-size:11.5px">Descripción <span class="req">*</span></label>
        <input type="text" data-idx="${idx}" data-campo="descripcion" value="${item.descripcion}" placeholder="Ej: Amoladora angular 7&quot;" required>
      </div>
      <div class="item-grid">
        <div class="field" style="margin-bottom:0">
          <label style="font-size:11.5px">Código</label>
          <input type="text" data-idx="${idx}" data-campo="codigo" value="${item.codigo}" placeholder="Opcional">
        </div>
        <div class="field" style="margin-bottom:0">
          <label style="font-size:11.5px">Cantidad <span class="req">*</span></label>
          <input type="number" min="1" data-idx="${idx}" data-campo="cantidad" value="${item.cantidad}" required>
        </div>
      </div>
      <div class="item-grid3">
        <div class="field" style="margin-bottom:0">
          <label style="font-size:11.5px">Marca</label>
          <input type="text" data-idx="${idx}" data-campo="extra_marca" value="${item.extra.Marca || ''}" placeholder="Opcional">
        </div>
        <div class="field" style="margin-bottom:0">
          <label style="font-size:11.5px">Modelo</label>
          <input type="text" data-idx="${idx}" data-campo="extra_modelo" value="${item.extra.Modelo || ''}" placeholder="Opcional">
        </div>
      </div>
      <div class="field" style="margin-top:8px">
        <label style="font-size:11.5px">N° de serie (opcional)</label>
        <input type="text" data-idx="${idx}" data-campo="extra_nroserie" value="${item.extra.NroSerie || ''}">
      </div>
      <button type="button" class="toggle-modo" data-idx="${idx}" style="margin-top:10px;background:none;border:none;color:var(--rojo-isl);font-size:12px;font-weight:600;padding:0;cursor:pointer">Elegir de la lista del inventario</button>
    `;
  }

  function renderItemGenerico_(item, idx){
    return `
      <span class="item-num">Ítem ${idx + 1}</span>
      ${state.items.length > 1 ? `<button type="button" class="quitar" data-idx="${idx}">×</button>` : ""}
      <div class="field" style="margin-bottom:0">
        <label style="font-size:11.5px">Descripción <span class="req">*</span></label>
        <input type="text" data-idx="${idx}" data-campo="descripcion" value="${item.descripcion}" placeholder="Ej: Arnés de seguridad" required>
      </div>
      <div class="item-grid">
        <div class="field" style="margin-bottom:0">
          <label style="font-size:11.5px">Código</label>
          <input type="text" data-idx="${idx}" data-campo="codigo" value="${item.codigo}" placeholder="Opcional">
        </div>
        <div class="field" style="margin-bottom:0">
          <label style="font-size:11.5px">Cantidad <span class="req">*</span></label>
          <input type="number" min="1" data-idx="${idx}" data-campo="cantidad" value="${item.cantidad}" required>
        </div>
      </div>
    `;
  }

  $("btnAgregarItem").addEventListener("click", () => {
    state.items.push(nuevoItemVacio());
    renderItems();
  });

  $("segmentedTipo").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-tipo]");
    if (!btn) return;
    state.tipo = btn.dataset.tipo;
    document.querySelectorAll("#segmentedTipo button").forEach(b => b.classList.toggle("activo", b === btn));
    $("cardObservaciones").classList.toggle("oculto", state.tipo !== "EPP");
    // Reiniciamos los ítems al cambiar de tipo (los campos no son compatibles entre uno y otro)
    state.items = [nuevoItemVacio()];
    renderItems();
  });

  function poblarSelect(select, opciones, placeholder){
    select.innerHTML = `<option value="" disabled selected>${placeholder}</option>` +
      opciones.map(o => `<option value="${o.id}">${o.nombre}</option>`).join("");
  }

  async function cargarCatalogos(){
    try {
      const res = await fetch(`${WEBAPP_URL}?accion=catalogo`);
      const data = await res.json();
      state.nodos = data.nodos || [];
      state.personal = data.personal || [];
      poblarSelect($("obraOrigen"), state.nodos, "Elegir origen…");
      poblarSelect($("obraDestino"), state.nodos, "Elegir destino…");
      poblarSelect($("recibeId"), state.personal, "Elegir destinatario…");
    } catch (err) {
      mostrarError("No se pudieron cargar los catálogos de obras/personal. Revisá tu conexión y recargá la página.");
    }
  }

  async function cargarHerramientasPorOrigen(){
    const nodoId = $("obraOrigen").value;
    state.herramientasDisponibles = [];
    if (!nodoId || state.tipo !== "Herramienta") { renderItems(); return; }

    state.cargandoHerramientas = true;
    renderItems();
    try {
      const res = await fetch(`${WEBAPP_URL}?accion=herramientas_por_nodo&nodo=${encodeURIComponent(nodoId)}`);
      const data = await res.json();
      state.herramientasDisponibles = data.herramientas || [];
    } catch (err) {
      mostrarError("No se pudo cargar el listado de herramientas de ese origen.");
    } finally {
      state.cargandoHerramientas = false;
      renderItems();
    }
  }

  $("obraOrigen").addEventListener("change", cargarHerramientasPorOrigen);

  $("obraDestino").addEventListener("change", () => {
    const nodoId = $("obraDestino").value;
    const nodo = state.nodos.find(n => String(n.id) === nodoId);
    const esExterno = nodo && String(nodo.tipo || "").indexOf("Externo") === 0;
    $("cardCliente").classList.toggle("oculto", !esExterno);
    $("cliente").required = esExterno;
    if (esExterno && !$("cliente").value) {
      $("cliente").value = nodo.nombre; // prellenado, editable
    }
  });

  function mostrarError(msg){
    const b = $("bannerError");
    b.textContent = msg;
    b.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function ocultarError(){
    $("bannerError").style.display = "none";
  }

  $("formRemito").addEventListener("submit", async (e) => {
    e.preventDefault();
    ocultarError();

    const itemsInvalidos = state.items.some(i => {
      if (state.tipo === "Herramienta" && i.modo === "lista") return !i.herramientaId || !i.cantidad;
      return !i.descripcion || !i.cantidad;
    });
    if (state.items.length === 0 || itemsInvalidos) {
      mostrarError("Completá todos los ítems: elegí la herramienta de la lista (o cargala manual) y la cantidad.");
      return;
    }

    const cardClienteVisible = !$("cardCliente").classList.contains("oculto");
    if (cardClienteVisible && !$("cliente").value.trim()) {
      mostrarError("Completá el campo Señor/es (destino externo, ingreso a planta).");
      return;
    }

    const payload = {
      obra_origen: $("obraOrigen").value,
      obra_destino: $("obraDestino").value,
      entrega: $("entrega").value.trim(),
      recibe_id: $("recibeId").value,
      observaciones: $("observaciones").value.trim(),
      cliente: cardClienteVisible ? $("cliente").value.trim() : "",
      domicilio: cardClienteVisible ? $("domicilio").value.trim() : "",
      localidad: cardClienteVisible ? $("localidad").value.trim() : "",
      cuit: cardClienteVisible ? $("cuit").value.trim() : "",
      items: state.items.map(i => {
        const extra = Object.assign({}, i.extra);
        if (i.herramientaId) extra.herramienta_id = i.herramientaId;
        return {
          tipo_recurso: state.tipo,
          codigo: i.codigo,
          descripcion: i.descripcion,
          cantidad: i.cantidad,
          unidad: i.unidad,
          extra: extra
        };
      })
    };

    $("btnSubmit").disabled = true;
    $("loadingLine").classList.remove("oculto");

    try {
      const url = `${WEBAPP_URL}?payload=${encodeURIComponent(JSON.stringify(payload))}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        mostrarError(data.detalle || data.error);
        $("btnSubmit").disabled = false;
        $("loadingLine").classList.add("oculto");
        return;
      }

      $("remitoIdTexto").textContent = data.remito_id;
      $("linkVerPdf").href = data.pdf_url;
      $("overlayExito").classList.add("visible");
    } catch (err) {
      mostrarError("No se pudo generar el remito. Revisá tu conexión e intentá de nuevo.");
    } finally {
      $("btnSubmit").disabled = false;
      $("loadingLine").classList.add("oculto");
    }
  });

  $("btnNuevoRemito").addEventListener("click", () => {
    $("overlayExito").classList.remove("visible");
    $("formRemito").reset();
    state.herramientasDisponibles = [];
    state.items = [nuevoItemVacio()];
    renderItems();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // Init
  state.items = [nuevoItemVacio()];
  renderItems();
  cargarCatalogos();
</script>

</body>
</html>
